
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="400"
    height="260"
    viewBox="0 0 400 260"
    fill="none"
    role="img"
    aria-labelledby="car-title car-desc"
>
    <title id="car-title">Véhicule EhouDeka</title>
    <desc id="car-desc">Illustration d'une voiture lorsque la photo du véhicule est indisponible.</desc>

    <defs>
        <linearGradient id="car-body" x1="90" y1="105" x2="310" y2="205">
            <stop offset="0%" stop-color="#39443E"/>
            <stop offset="100%" stop-color="#242C28"/>
        </linearGradient>

        <linearGradient id="car-window" x1="150" y1="110" x2="250" y2="155">
            <stop offset="0%" stop-color="#DCE8DF"/>
            <stop offset="100%" stop-color="#A9BCAF"/>
        </linearGradient>

        <filter id="car-shadow" x="40" y="130" width="320" height="100">
            <feGaussianBlur stdDeviation="9"/>
        </filter>
    </defs>

    <!-- Fond -->
    <rect width="400" height="260" fill="#F5F2EA"/>

    <!-- Décoration discrète -->
    <circle cx="200" cy="124" r="94" fill="#A9BCAF" opacity=".13"/>
    <circle cx="200" cy="124" r="76" stroke="#D8C6A0" stroke-opacity=".35" stroke-width="1.5"/>

    <circle cx="91" cy="82" r="3" fill="#D8C6A0"/>
    <circle cx="309" cy="91" r="4" fill="#A9BCAF"/>
    <circle cx="286" cy="190" r="3" fill="#D8C6A0"/>

    <!-- Ombre au sol -->
    <ellipse
        cx="200"
        cy="202"
        rx="116"
        ry="13"
        fill="#242C28"
        opacity=".15"
        filter="url(#car-shadow)"
    />

    <!-- Voiture : carrosserie -->
    <path
        d="M79 169
           L89 148
           C93 140 101 134 111 131
           L132 124
           L157 94
           C164 86 174 82 185 82
           H241
           C253 82 263 88 270 98
           L294 132
           L315 139
           C325 143 332 151 334 161
           L338 176
           C340 184 334 191 326 191
           H75
           C67 191 62 184 65 176
           Z"
        fill="url(#car-body)"
    />

    <!-- Partie supérieure / fenêtres -->
    <path
        d="M144 124
           L165 99
           C170 93 177 90 185 90
           H205
           V125
           Z"
        fill="url(#car-window)"
    />

    <path
        d="M214 90
           H241
           C249 90 256 95 261 102
           L278 125
           H214
           Z"
        fill="url(#car-window)"
    />

    <!-- Montant central -->
    <path
        d="M209 90 V129"
        stroke="#242C28"
        stroke-width="5"
        stroke-linecap="round"
    />

    <!-- Ligne de carrosserie -->
    <path
        d="M87 157 H316"
        stroke="#A9BCAF"
        stroke-opacity=".55"
        stroke-width="2"
        stroke-linecap="round"
    />

    <!-- Phares -->
    <path
        d="M322 150 L333 155 L335 166 H322"
        fill="#D8C6A0"
    />

    <path
        d="M69 158 L80 154 L85 166 H68"
        fill="#A9BCAF"
    />

    <!-- Portières -->
    <path
        d="M143 130 L139 179 M214 130 L218 179"
        stroke="#858C85"
        stroke-opacity=".7"
        stroke-width="1.5"
    />

    <path
        d="M159 143 H177"
        stroke="#D8C6A0"
        stroke-width="2"
        stroke-linecap="round"
    />

    <path
        d="M232 143 H250"
        stroke="#D8C6A0"
        stroke-width="2"
        stroke-linecap="round"
    />

    <!-- Roues -->
    <circle cx="119" cy="185" r="24" fill="#242C28"/>
    <circle cx="119" cy="185" r="14" fill="#858C85"/>
    <circle cx="119" cy="185" r="7" fill="#F5F2EA"/>
    <circle cx="119" cy="185" r="3" fill="#D8C6A0"/>

    <circle cx="283" cy="185" r="24" fill="#242C28"/>
    <circle cx="283" cy="185" r="14" fill="#858C85"/>
    <circle cx="283" cy="185" r="7" fill="#F5F2EA"/>
    <circle cx="283" cy="185" r="3" fill="#D8C6A0"/>

    <!-- Message -->
    <rect x="137" y="222" width="126" height="23" rx="11.5" fill="#FFFFFF"/>
    <circle cx="151" cy="233.5" r="3" fill="#A9BCAF"/>

    <text
        x="202"
        y="237"
        font-family="Inter, sans-serif"
        font-size="10"
        font-weight="600"
        letter-spacing=".2"
        fill="#858C85"
        text-anchor="middle"
    >Photo non disponible</text>
</svg>
